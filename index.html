<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070914">
<title>Brain TAX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;color:#fff;
  font-family:Inter,Arial,sans-serif;
  background:
  radial-gradient(circle at 10% 10%,#26336d 0,transparent 30%),
  radial-gradient(circle at 90% 20%,#432565 0,transparent 28%),
  #070914;
}
button,input{font:inherit}
button{cursor:pointer}
.screen{display:none;min-height:100vh;padding:20px}
.screen.active{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

.container{max-width:1100px;margin:auto}
.center{min-height:calc(100vh - 40px);display:grid;place-items:center}

.logo{
 width:125px;height:125px;border-radius:38px;margin:auto;
 display:grid;place-items:center;font-size:58px;
 background:linear-gradient(145deg,#20295c,#101426);
 box-shadow:0 0 70px #596dff55;
 animation:logo .9s cubic-bezier(.2,.8,.2,1);
}
@keyframes logo{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}

.brand{
 margin-top:25px;text-align:center;font-size:clamp(48px,10vw,86px);
 font-weight:950;letter-spacing:-4px;
 background:linear-gradient(90deg,#fff,#72ddff,#aa7aff,#fff);
 background-size:250%;
 -webkit-background-clip:text;color:transparent;
 animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:250%}}

.sub{text-align:center;color:#aab2cf;margin-top:10px}
.primary{
 border:0;color:#fff;font-weight:850;
 padding:15px 24px;border-radius:15px;
 background:linear-gradient(135deg,#6678ff,#a160ff);
 box-shadow:0 12px 35px #6678ff38;
 transition:.2s;
}
.primary:hover{transform:translateY(-3px);box-shadow:0 18px 45px #6678ff55}
.start{display:block;margin:32px auto 0;font-size:17px}

.panel{
 max-width:520px;width:100%;padding:30px;
 border-radius:28px;background:#151a2dcc;
 border:1px solid #ffffff14;
 backdrop-filter:blur(20px);
 box-shadow:0 30px 90px #0006;
}
.panel h2{text-align:center;font-size:29px}
.panel p{text-align:center;color:#aab2cf;margin-top:8px}
.input{
 width:100%;margin-top:24px;padding:16px;
 border-radius:14px;border:1px solid #ffffff18;
 background:#070914aa;color:white;outline:0;
}
.input:focus{border-color:#7180ff;box-shadow:0 0 0 4px #7180ff20}
.full{width:100%;margin-top:12px}

.top{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;margin-bottom:25px;
}
.welcome small{color:#8e97b8}
.welcome h1{font-size:clamp(28px,6vw,44px)}
.stats{display:flex;gap:8px}
.stat{
 padding:10px 13px;border-radius:13px;
 background:#ffffff09;border:1px solid #ffffff10;
 font-size:13px
}
.stat b{color:#ffd166}

.lang{
 display:flex;gap:7px;
 padding:4px;border-radius:12px;background:#ffffff08;
}
.lang button{
 border:0;padding:8px 11px;border-radius:9px;
 color:#9ca5c4;background:transparent;
}
.lang button.on{background:#6879ff;color:white}

.title{color:#dce1f5;margin:20px 0 12px;font-size:14px;font-weight:800}

.modes{
 display:grid;grid-template-columns:repeat(3,1fr);gap:15px
}
.mode{
 position:relative;overflow:hidden;
 min-height:185px;padding:23px;text-align:left;
 color:#fff;border:1px solid #ffffff10;border-radius:23px;
 background:linear-gradient(145deg,#1b2140e8,#101323e8);
 transition:.25s;
}
.mode:hover{
 transform:translateY(-7px);
 border-color:#7180ff66;
 box-shadow:0 20px 50px #0005
}
.mode:after{
 content:"";position:absolute;width:150px;height:150px;
 border-radius:50%;right:-70px;top:-70px;
 background:#7280ff14
}
.icon{font-size:39px;margin-bottom:13px}
.mode h3{font-size:21px}
.mode p{color:#9fa8c5;font-size:13px;line-height:1.5;margin-top:7px}
.arrow{position:absolute;right:18px;bottom:17px;color:#8a96ff;font-size:22px}

.level-head{
 display:flex;align-items:center;gap:12px;margin-bottom:20px
}
.back{
 width:45px;height:45px;border-radius:13px;
 border:1px solid #ffffff12;background:#ffffff09;color:white;font-size:20px
}
.level-head h2{flex:1}
.levels{
 display:grid;grid-template-columns:repeat(5,1fr);gap:11px
}
.level{
 aspect-ratio:1;border-radius:18px;
 border:1px solid #ffffff12;
 background:linear-gradient(145deg,#1a2040,#101323);
 color:#fff;font-weight:850;
 transition:.2s;position:relative;
}
.level:hover:not(:disabled){transform:translateY(-4px);border-color:#7180ff77}
.level.done{background:linear-gradient(145deg,#173d35,#102821)}
.level.locked{opacity:.38;cursor:not-allowed}
.level small{display:block;color:#8992af;font-size:10px;margin-top:3px}

.quiz{max-width:780px;margin:auto}
.question-card{
 padding:29px;border-radius:27px;
 background:#151a2dcc;border:1px solid #ffffff12;
 backdrop-filter:blur(18px);
 box-shadow:0 30px 90px #0004
}
.quiztop{display:flex;align-items:center;gap:12px;margin-bottom:17px}
.quiztitle{flex:1}
.quiztitle small{color:#8d96b6}
.quiztitle h2{font-size:21px}
.count{font-size:13px;color:#9ca5c2}
.progress{height:7px;background:#ffffff0d;border-radius:20px;overflow:hidden;margin-bottom:22px}
.progress span{
 display:block;height:100%;width:0;
 background:linear-gradient(90deg,#6477ff,#48dcff);
 transition:.35s
}
.qnum{color:#8793ff;font-size:12px;font-weight:900}
.question{font-size:clamp(22px,4vw,31px);font-weight:850;line-height:1.35;margin-top:9px}
.options{display:grid;gap:11px;margin-top:24px}
.option{
 padding:17px;text-align:left;border-radius:15px;
 border:1px solid #ffffff12;background:#ffffff07;
 color:#fff;font-weight:650;transition:.2s
}
.option:hover{transform:translateX(4px);background:#6879ff16}
.option.correct{background:#2bd98a18;border-color:#2bd98a88}
.option.wrong{background:#ff527018;border-color:#ff527088}
.option:disabled{cursor:default}
.bottom{
 display:flex;align-items:center;justify-content:space-between;
 margin-top:17px;color:#8992af;font-size:13px
}
.next{display:none;padding:12px 20px}

.result{text-align:center;max-width:620px;margin:70px auto}
.resulticon{font-size:75px;animation:pop .6s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.result h1{font-size:42px;margin-top:10px}
.result p{color:#aab2cf;margin-top:7px}
.resultstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}
.rstat{padding:17px;border-radius:18px;background:#ffffff08}
.rstat b{display:block;font-size:25px}
.rstat span{font-size:11px;color:#8992af}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1}

.overlay{
 position:fixed;inset:0;background:#000a;backdrop-filter:blur(8px);
 display:none;place-items:center;padding:20px;z-index:20
}
.overlay.show{display:grid}
.popup{
 width:100%;max-width:540px;padding:27px;border-radius:25px;
 background:#151a2b;border:1px solid #ffffff14;
 box-shadow:0 30px 100px #0008;
 animation:pop .3s ease
}
.bad{color:#ff718b;font-weight:850}
.popup h2{margin-top:6px}
.solution{margin-top:16px;color:#cbd0e3;line-height:1.7}
.popupactions{display:flex;gap:10px;margin-top:20px}
.popupactions button{flex:1;padding:13px;border-radius:13px}

@media(max-width:800px){
 .modes{grid-template-columns:repeat(2,1fr)}
 .levels{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:520px){
 .screen{padding:15px}
 .top{align-items:flex-start}
 .stats{flex-direction:column}
 .modes{grid-template-columns:1fr}
 .mode{min-height:145px}
 .levels{grid-template-columns:repeat(4,1fr)}
 .question-card{padding:21px}
 .resultstats{gap:6px}
 .rstat{padding:13px 5px}
}
</style>
</head>

<body>

<!-- INTRO -->
<section id="intro" class="screen active">
 <div class="center">
  <div>
   <div class="logo">🧠</div>
   <div class="brand">Brain TAX</div>
   <div class="sub" data-i="tag">Train your brain. Challenge your limits.</div>
   <button class="primary start" onclick="openName()" data-i="start">START TRAINING</button>
  </div>
 </div>
</section>

<!-- NAME -->
<section id="nameScreen" class="screen">
 <div class="center">
  <div class="panel">
   <div style="font-size:50px;text-align:center">👋</div>
   <h2 data-i="welcome">Welcome to Brain TAX</h2>
   <p data-i="enter">Enter your name to start.</p>
   <input id="nameInput" class="input" maxlength="25" data-ph="name">
   <button class="primary full" onclick="saveName()" data-i="continue">CONTINUE →</button>
  </div>
 </div>
</section>

<!-- HOME -->
<section id="homeScreen" class="screen">
 <div class="container">
  <div class="top">
   <div class="welcome">
    <small data-i="welcomeBack">WELCOME BACK</small>
    <h1 id="player"></h1>
   </div>
   <div>
    <div class="lang">
     <button id="hi" onclick="setLang('hi')">हिन्दी</button>
     <button id="en" class="on" onclick="setLang('en')">English</button>
    </div>
    <div class="stats" style="margin-top:7px">
     <div class="stat">⚡ XP <b id="xp">0</b></div>
     <div class="stat">🏆 Best <b id="best">0</b></div>
    </div>
   </div>
  </div>

  <div class="title" data-i="choose">CHOOSE YOUR CHALLENGE</div>

  <div class="modes">
   <button class="mode" onclick="openLevels('puzzle')">
    <div class="icon">🧩</div><h3 data-i="puzzle">Puzzle Quiz</h3>
    <p data-i="puzzleDesc">Logic, patterns and brain puzzles.</p><div class="arrow">→</div>
   </button>

   <button class="mode" onclick="openLevels('math')">
    <div class="icon">➗</div><h3 data-i="math">Mathematics</h3>
    <p data-i="mathDesc">Calculation and mathematical reasoning.</p><div class="arrow">→</div>
   </button>

   <button class="mode" onclick="openLevels('focus')">
    <div class="icon">🎯</div><h3 data-i="focus">Focus Test</h3>
    <p data-i="focusDesc">Attention and observation challenges.</p><div class="arrow">→</div>
   </button>

   <button class="mode" onclick="openLevels('memory')">
    <div class="icon">🧠</div><h3 data-i="memory">Memory Test</h3>
    <p data-i="memoryDesc">Remember and recall information.</p><div class="arrow">→</div>
   </button>

   <button class="mode" onclick="openLevels('tricky')">
    <div class="icon">⚡</div><h3 data-i="tricky">Tricky Test</h3>
    <p data-i="trickyDesc">Think twice before answering.</p><div class="arrow">→</div>
   </button>

   <button class="mode" onclick="openLevels('mixed')">
    <div class="icon">🔥</div><h3 data-i="mixed">Brain Challenge</h3>
    <p data-i="mixedDesc">The ultimate mixed brain challenge.</p><div class="arrow">→</div>
   </button>
  </div>
 </div>
</section>

<!-- LEVELS -->
<section id="levelsScreen" class="screen">
 <div class="container">
  <div class="level-head">
   <button class="back" onclick="goHome()">←</button>
   <h2 id="levelsTitle">Levels</h2>
   <span id="levelCount" class="count"></span>
  </div>
  <div class="levels" id="levelGrid"></div>
 </div>
</section>

<!-- QUIZ -->
<section id="quizScreen" class="screen">
 <div class="quiz">
  <div class="quiztop">
   <button class="back" onclick="openLevels(currentMode)">←</button>
   <div class="quiztitle">
    <small>Brain TAX</small>
    <h2 id="quizTitle"></h2>
   </div>
   <div class="count" id="qCount"></div>
  </div>

  <div class="progress"><span id="progress"></span></div>

  <div class="question-card">
   <div class="qnum" id="qNum"></div>
   <div class="question" id="question"></div>
   <div class="options" id="options"></div>

   <div class="bottom">
    <span>⏱️ <span data-i="time">Time</span>: <b id="time">0.0s</b></span>
    <button id="next" class="primary next" onclick="nextQuestion()">NEXT →</button>
   </div>
  </div>
 </div>
</section>

<!-- RESULT -->
<section id="resultScreen" class="screen">
 <div class="result">
  <div class="resulticon" id="resultIcon">🏆</div>
  <h1 id="resultTitle">Great Work!</h1>
  <p id="resultSub"></p>

  <div class="resultstats">
   <div class="rstat"><b id="finalScore">0/5</b><span>SCORE</span></div>
   <div class="rstat"><b id="finalXP">+0</b><span>XP</span></div>
   <div class="rstat"><b id="finalTime">0s</b><span>TIME</span></div>
  </div>

  <div class="actions">
   <button class="back" onclick="openLevels(currentMode)">LEVELS</button>
   <button class="primary" onclick="retry()">PLAY AGAIN</button>
  </div>
 </div>
</section>

<!-- SOLUTION -->
<div id="overlay" class="overlay">
 <div class="popup">
  <div class="bad" data-i="wrong">✕ Not quite!</div>
  <h2 data-i="learn">Let's understand it.</h2>
  <div class="solution" id="solution"></div>
  <div class="popupactions">
   <button class="back" onclick="closePopup()">OK</button>
   <button class="primary" onclick="closePopup();nextQuestion()">NEXT →</button>
  </div>
 </div>
</div>

<script>
/* =========================================
   BRAIN TAX — 100+ LEVEL ENGINE
========================================= */

const modes={
 puzzle:{en:"Puzzle Quiz",hi:"पज़ल क्विज़"},
 math:{en:"Mathematics",hi:"गणित"},
 focus:{en:"Focus Test",hi:"फोकस टेस्ट"},
 memory:{en:"Memory Test",hi:"मेमोरी टेस्ट"},
 tricky:{en:"Tricky Test",hi:"ट्रिकी टेस्ट"},
 mixed:{en:"Brain Challenge",hi:"ब्रेन चैलेंज"}
};

const i18n={
 en:{
  tag:"Train your brain. Challenge your limits.",
  start:"START TRAINING",welcome:"Welcome to Brain TAX",
  enter:"Enter your name to start.",continue:"CONTINUE →",
  welcomeBack:"WELCOME BACK",choose:"CHOOSE YOUR CHALLENGE",
  puzzle:"Puzzle Quiz",puzzleDesc:"Logic, patterns and brain puzzles.",
  math:"Mathematics",mathDesc:"Calculation and mathematical reasoning.",
  focus:"Focus Test",focusDesc:"Attention and observation challenges.",
  memory:"Memory Test",memoryDesc:"Remember and recall information.",
  tricky:"Tricky Test",trickyDesc:"Think twice before answering.",
  mixed:"Brain Challenge",mixedDesc:"The ultimate mixed brain challenge.",
  time:"Time",wrong:"✕ Not quite!",learn:"Let's understand it."
 },
 hi:{
  tag:"अपने दिमाग को ट्रेन करो। अपनी सीमा को चुनौती दो।",
  start:"ट्रेनिंग शुरू करें",welcome:"Brain TAX में स्वागत है",
  enter:"शुरू करने के लिए अपना नाम डालें।",continue:"जारी रखें →",
  welcomeBack:"वापसी पर स्वागत है",choose:"अपनी चुनौती चुनें",
  puzzle:"पज़ल क्विज़",puzzleDesc:"लॉजिक, पैटर्न और दिमागी पज़ल।",
  math:"गणित",mathDesc:"कैलकुलेशन और गणितीय रीजनिंग।",
  focus:"फोकस टेस्ट",focusDesc:"ध्यान और ऑब्ज़र्वेशन की चुनौती।",
  memory:"मेमोरी टेस्ट",memoryDesc:"याद रखो और सही जानकारी recall करो।",
  tricky:"ट्रिकी टेस्ट",trickyDesc:"जवाब देने से पहले दो बार सोचो।",
  mixed:"ब्रेन चैलेंज",mixedDesc:"सभी टेस्ट का ultimate combination।",
  time:"समय",wrong:"✕ सही नहीं!",learn:"आइए इसे समझते हैं।"
 }
};

let lang=localStorage.getItem("btLang")||"en";
let name=localStorage.getItem("btName")||"";
let xp=+localStorage.getItem("btXP")||0;
let currentMode="";
let currentLevel=0;
let questions=[];
let qIndex=0;
let score=0;
let totalTime=0;
let started=0;
let answered=false;
let currentItem=null;

/* Each category has 105 levels */
const LEVELS=105;

/* Completed levels */
function key(mode){return "bt_"+mode}
function completed(mode){
 return JSON.parse(localStorage.getItem(key(mode))||"[]")
}
function saveCompleted(mode,level){
 let arr=completed(mode);
 if(!arr.includes(level))arr.push(level);
 localStorage.setItem(key(mode),JSON.stringify(arr));
}

/* Deterministic random number */
function rnd(seed){
 const x=Math.sin(seed)*10000;
 return x-Math.floor(x);
}

/* =========================================
   QUESTION GENERATORS
========================================= */

function makeQuestion(mode,level,index){
 const seed=level*97+index*31;
 const d=Math.min(20,Math.floor((level-1)/10)+1);

 if(mode==="math")return mathQ(level,index,d,seed);
 if(mode==="focus")return focusQ(level,index,seed);
 if(mode==="memory")return memoryQ(level,index,seed);
 if(mode==="tricky")return trickyQ(level,index,seed);
 if(mode==="mixed"){
   const arr=["puzzle","math","focus","memory","tricky"];
   return makeQuestion(arr[index%5],level,index);
 }
 return puzzleQ(level,index,d,seed);
}

/* ---------- MATH ---------- */
function mathQ(level,i,d,s){
 let type=(level+i)%5;

 if(type===0){
  let a=10+d*3+Math.floor(rnd(s)*30);
  let b=2+d+Math.floor(rnd(s+1)*10);
  let ans=a*b;
  return mc(
   `What is ${a} × ${b}?`,
   `${a} × ${b} = ${ans}.`,
   ans,
   [ans+10,ans-10,ans+20],
   `गुणा करें: ${a} × ${b} = ${ans}।`,
   `Multiply: ${a} × ${b} = ${ans}.`
  );
 }

 if(type===1){
  let x=5+d+Math.floor(rnd(s)*15);
  let b=3+d;
  let c=x+b;
  return mc(
   `If x + ${b} = ${c}, what is x?`,
   `x = ${c} − ${b} = ${x}.`,
   x,[x+1,x-1,x+2],
   `x = ${c} − ${b} = ${x}।`,
   `x = ${c} − ${b} = ${x}.`
  );
 }

 if(type===2){
  let a=20+d*2;
  let p=10+d;
  let ans=a*p/100;
  return mc(
   `What is ${p}% of ${a}?`,
   `${p}% of ${a} = ${ans}.`,
   ans,[ans+2,ans-2,ans+5],
   `${a} का ${p}% = ${ans}।`,
   `${p}% of ${a} = ${ans}.`
  );
 }

 if(type===3){
  let a=30+d*4;
  let b=10+d*2;
  let ans=a+b;
  return mc(
   `A number is ${a}. Add ${b}. What do you get?`,
   `${a} + ${b} = ${ans}.`,
   ans,[ans+1,ans-1,ans+5],
   `${a} + ${b} = ${ans}।`,
   `${a} + ${b} = ${ans}.`
  );
 }

 let a=80+d*5,b=20+d*3;
 let ans=a-b;
 return mc(
  `What is ${a} − ${b}?`,
  `${a} − ${b} = ${ans}.`,
  ans,[ans+2,ans-2,ans+10],
  `${a} − ${b} = ${ans}।`,
  `${a} − ${b} = ${ans}.`
 );
}

/* ---------- PUZZLE ---------- */
function puzzleQ(level,i,d,s){
 const list=[
  {
   q:"Find the next number: 2, 6, 12, 20, 30, ?",
   a:42,o:[40,42,44],hi:"अंतर 4, 6, 8, 10 हैं। अगला अंतर 12 है, इसलिए 42।",en:"The differences are 4, 6, 8, 10. The next difference is 12, giving 42."
  },
  {
   q:"All Bloops are Razzies. All Razzies are Lazzies. What must be true?",
   a:"All Bloops are Lazzies",o:["All Lazzies are Bloops","All Bloops are Lazzies","No Bloops are Lazzies"],
   hi:"अगर हर Bloop Razzie है और हर Razzie Lazzie है, तो हर Bloop Lazzie भी होगा।",en:"If every Bloop is a Razzie and every Razzie is a Lazzie, every Bloop is also a Lazzie."
  },
  {
   q:"A farmer has 17 sheep. All but 9 run away. How many remain?",
   a:9,o:[8,9,17],hi:"'All but 9' का मतलब 9 नहीं भागे। इसलिए 9 बचे।",en:"'All but 9' means 9 did not run away, so 9 remain."
  },
  {
   q:"Which is the odd one out?",
   a:"Cube",o:["Triangle","Circle","Square"],hi:"Cube 3D solid है, बाकी 2D shapes हैं।",en:"A cube is a 3D solid; the others are 2D shapes."
  },
  {
   q:"If today is Monday, what day will it be after 10 days?",
   a:"Thursday",o:["Wednesday","Thursday","Friday"],hi:"7 दिन बाद फिर Monday, और 3 दिन बाद Thursday।",en:"After 7 days it is Monday again, then 3 more days gives Thursday."
  }
 ];
 const z=list[(level+i)%list.length];
 return mc(z.q,z.en,z.a,z.o.filter(x=>x!==z.a),z.hi,z.en);
}

/* ---------- FOCUS ---------- */
function focusQ(level,i,s){
 const n=level+i;
 const repeated=7+(n%8);
 return mc(
  `Which number appears twice? ${repeated}, 4, 8, 2, ${repeated}, 9`,
  `${repeated} appears twice.`,
  repeated,[4,8,2],
  `${repeated} दो बार दिखाई देता है।`,
  `${repeated} appears twice.`
 );
}

/* ---------- MEMORY ---------- */
function memoryQ(level,i,s){
 const nums=[];
 for(let j=0;j<5;j++)nums.push(1+Math.floor(rnd(level*13+i*7+j)*20));
 const pos=(level+i)%5;
 const answer=nums[pos];
 return mc(
  `Remember this sequence: ${nums.join(", ")}. Which number was in position ${pos+1}?`,
  `Position ${pos+1} contains ${answer}.`,
  answer,
  [nums[(pos+1)%5],nums[(pos+2)%5],nums[(pos+3)%5]],
  `क्रम में ${pos+1}वीं जगह का नंबर ${answer} था।`,
  `The number at position ${pos+1} was ${answer}.`
 );
}

/* ---------- TRICKY ---------- */
function trickyQ(level,i,s){
 const list=[
  {
   q:"How many months have 28 days?",
   a:12,o:[1,2,11],
   hi:"हर महीने में कम से कम 28 दिन होते हैं।",en:"Every month has at least 28 days."
  },
  {
   q:"You enter a dark room with a candle, lamp and fireplace. You have one match. What do you light first?",
   a:"The match",o:["Candle","Lamp","Fireplace"],
   hi:"किसी चीज़ को जलाने से पहले match जलानी होगी।",en:"You need to light the match before lighting anything else."
  },
  {
   q:"A plane crashes on a border. Where do you bury the survivors?",
   a:"Nowhere",o:["India","Nepal","The border"],
   hi:"Survivors ज़िंदा हैं, उन्हें bury नहीं करते।",en:"Survivors are alive, so you do not bury them."
  },
  {
   q:"If you overtake the person in second place, what position are you in?",
   a:"Second",o:["First","Third","Last"],
   hi:"आप second-place वाले की position लेते हैं।",en:"You take the position of the person you overtook: second."
  },
  {
   q:"A doctor gives you 3 pills, one every 30 minutes. How long until all are taken?",
   a:"60 minutes",o:["30 minutes","90 minutes","120 minutes"],
   hi:"पहली अभी, दूसरी 30 मिनट बाद, तीसरी 60 मिनट बाद।",en:"The first is immediate, the second at 30 minutes, and the third at 60 minutes."
  }
 ];
 const z=list[(level+i)%list.length];
 return mc(z.q,z.en,z.a,z.o,z.hi,z.en);
}

/* ---------- MULTIPLE CHOICE ---------- */
function mc(q,en,a,wrong,hi,en2){
 let opts=[a,...wrong];
 /* deterministic shuffle */
 let seed=q.length+a.toString().length;
 for(let i=opts.length-1;i>0;i--){
   let j=Math.floor(rnd(seed+i*17)*(i+1));
   [opts[i],opts[j]]=[opts[j],opts[i]];
 }
 return {
  q,
  options:opts,
  answer:opts.indexOf(a),
  hi,
  en:en2||en
 };
}

/* =========================================
   SCREEN FUNCTIONS
========================================= */

function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 window.scrollTo(0,0);
}

function openName(){
 show("nameScreen");
 setTimeout(()=>document.getElementById("nameInput").focus(),250);
}

function saveName(){
 const v=document.getElementById("nameInput").value.trim();
 if(!v)return;
 name=v;
 localStorage.setItem("btName",name);
 loadHome();
}

function loadHome(){
 document.getElementById("player").textContent=name||"Brain User";
 document.getElementById("xp").textContent=xp;
 document.getElementById("best").textContent=getBest();
 show("homeScreen");
}

function getBest(){
 let total=0;
 Object.keys(modes).forEach(m=>total+=completed(m).length);
 return total;
}

function goHome(){loadHome()}

/* =========================================
   LANGUAGE
========================================= */

function setLang(l){
 lang=l;
 localStorage.setItem("btLang",l);

 document.querySelectorAll("[data-i]").forEach(el=>{
   const k=el.getAttribute("data-i");
   if(i18n[l][k])el.textContent=i18n[l][k];
 });

 document.querySelectorAll("[data-ph]").forEach(el=>{
   el.placeholder=l==="hi"?"अपना नाम लिखें":"Enter your name";
 });

 document.getElementById("hi").classList.toggle("on",l==="hi");
 document.getElementById("en").classList.toggle("on",l==="en");

 if(document.getElementById("homeScreen").classList.contains("active"))
   loadHome();
}

/* =========================================
   LEVEL MAP
========================================= */

function openLevels(mode){
 currentMode=mode;
 document.getElementById("levelsTitle").textContent=modes[mode][lang];
 document.getElementById("levelCount").textContent=LEVELS+"+ Levels";

 const grid=document.getElementById("levelGrid");
 grid.innerHTML="";
 const done=completed(mode);

 for(let i=1;i<=LEVELS;i++){
  const b=document.createElement("button");
  b.className="level";
  b.textContent=i;

  if(done.includes(i)){
    b.classList.add("done");
    b.innerHTML="✓<small>"+i+"</small>";
  }

  /* First level always open; next level unlocks after previous */
  if(i>1 && !done.includes(i-1)){
    b.disabled=true;
    b.classList.add("locked");
    b.innerHTML="🔒<small>"+i+"</small>";
  }

  b.onclick=()=>startQuiz(mode,i);
  grid.appendChild(b);
 }
 show("levelsScreen");
}

/* =========================================
   QUIZ
========================================= */

function startQuiz(mode,level){
 currentMode=mode;
 currentLevel=level;
 questions=[];

 for(let i=0;i<5;i++){
   questions.push(makeQuestion(mode,level,i));
 }

 qIndex=0;
 score=0;
 totalTime=0;
 show("quizScreen");

 document.getElementById("quizTitle").textContent=modes[mode][lang]+" • Level "+level;
 renderQuestion();
}

function renderQuestion(){
 currentItem=questions[qIndex];
 answered=false;
 started=performance.now();

 document.getElementById("qCount").textContent=
   `${qIndex+1} / ${questions.length}`;

 document.getElementById("qNum").textContent=
   "QUESTION "+String(qIndex+1).padStart(2,"0");

 document.getElementById("question").textContent=currentItem.q;
 document.getElementById("time").textContent="0.0s";

 document.getElementById("progress").style.width=
   `${qIndex/questions.length*100}%`;

 const next=document.getElementById("next");
 next.style.display="none";

 const box=document.getElementById("options");
 box.innerHTML="";

 currentItem.options.forEach((x,i)=>{
   const b=document.createElement("button");
   b.className="option";
   b.textContent=x;
   b.onclick=()=>answer(i,b);
   box.appendChild(b);
 });
}

function answer(index,button){
 if(answered)return;
 answered=true;

 const seconds=(performance.now()-started)/1000;
 totalTime+=seconds;
 document.getElementById("time").textContent=seconds.toFixed(1)+"s";

 const buttons=document.querySelectorAll(".option");

 buttons.forEach((b,i)=>{
   b.disabled=true;
   if(i===currentItem.answer)b.classList.add("correct");
 });

 if(index===currentItem.answer){
   score++;
   addXP(10);
   button.classList.add("correct");
   document.getElementById("next").style.display="block";
 }else{
   button.classList.add("wrong");
   showSolution();
 }
}

function nextQuestion(){
 document.getElementById("overlay").classList.remove("show");

 if(qIndex<questions.length-1){
   qIndex++;
   renderQuestion();
 }else{
   finishLevel();
 }
}

function finishLevel(){
 saveCompleted(currentMode,currentLevel);

 const gained=score*10;

 document.getElementById("finalScore").textContent=
   `${score}/${questions.length}`;

 document.getElementById("finalXP").textContent="+"+gained;
 document.getElementById("finalTime").textContent=
   totalTime.toFixed(1)+"s";

 if(score===5){
   document.getElementById("resultIcon").textContent="👑";
   document.getElementById("resultTitle").textContent=
     lang==="hi"?"Perfect Brain!":"Perfect Brain!";
   document.getElementById("resultSub").textContent=
     lang==="hi"
     ?"शानदार! अगला level unlock हो गया।"
     :"Outstanding! The next level is unlocked.";
 }else{
   document.getElementById("resultIcon").textContent="🏆";
   document.getElementById("resultTitle").textContent=
     lang==="hi"?"Level Complete!":"Level Complete!";
   document.getElementById("resultSub").textContent=
     lang==="hi"
     ?"अच्छा काम! अगला level unlock हो गया।"
     :"Good work! The next level is unlocked.";
 }

 show("resultScreen");
}

function retry(){
 startQuiz(currentMode,currentLevel);
}

function addXP(n){
 xp+=n;
 localStorage.setItem("btXP",xp);
 document.getElementById("xp").textContent=xp;
}

/* =========================================
   SOLUTION
========================================= */

function showSolution(){
 document.getElementById("solution").textContent=
   lang==="hi"?currentItem.hi:currentItem.en;

 document.getElementById("overlay").classList.add("show");
}

function closePopup(){
 document.getElementById("overlay").classList.remove("show");
 document.getElementById("next").style.display="block";
}

/* live elapsed time — NO COUNTDOWN */
setInterval(()=>{
 if(document.getElementById("quizScreen").classList.contains("active")&&!answered){
   document.getElementById("time").textContent=
     ((performance.now()-started)/1000).toFixed(1)+"s";
 }
},100);

/* Enter key */
document.getElementById("nameInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")saveName();
});

/* Init */
setLang(lang);

if(name){
 document.getElementById("nameInput").value=name;
}

/* Prevent accidental old state from breaking first level */
if(!completed("puzzle").length){
 /* Level 1 is intentionally available even before anything is completed. */
}
